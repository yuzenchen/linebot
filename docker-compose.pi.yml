# 樹莓派（Pi 5，aarch64 / 2GB）正式版：在 Pi 上直接 build + 啟動
#   docker compose -f docker-compose.pi.yml up -d --build
# 之後在家用網路可用 curl http://<Pi 的 IP>:8090/health 檢查。
#
# port：對外 8090。Pi 上 80/443/3000/3001/3002/3100/8080/8088 已被其他專案占用。
# 資料：SQLite 落在 Pi 上的 ./data/linebot.db（bind mount ./data:/data，不用 named volume），
#       備份＝直接複製整個 data 資料夾（含 linebot.db-wal / -shm，建議先 stop 再複製）。
#       首次啟動前先 `mkdir -p data`，讓資料夾屬於登入使用者（uid 1000，與容器內 node 使用者相同），
#       否則由 Docker 自動建立會是 root 所有，容器無法寫入。
# 設定：讀同目錄的 .env（cp .env.example .env 後填值）。改 .env 後要重建容器才會生效：
#   docker compose -f docker-compose.pi.yml up -d --force-recreate linebot
# 更新：git pull 後重跑第一行即可。
# 對外（Cloudflare Tunnel）：linebot 另外加入外部既有的 network bfx-multi_default
#       （Pi 上 Cloudflare Tunnel 容器 bfx-cloudflared 所在，由另一個 compose 專案建立），
#       Zero Trust Public Hostname 的 Service 填 http://linebot:8090，
#       LINE webhook URL 填 https://linebot.<網域>/webhook。
#       若該 network 不存在（例如別台機器）compose 會直接報錯；本機開發請改用 docker-compose.yml。
#
# 管理端（第二個容器 linebot-admin，SPEC-ADMIN 第 3 節）：
#   - 同一個 image、同一份程式碼，只靠 BOT_PROFILE=admin 切換行為。它掛在 compose profile「admin」下，
#     所以上面那行 up 只會起客戶端；要一起起管理端用：
#       docker compose -f docker-compose.pi.yml --profile admin up -d --build
#     （.env.admin 還沒建好之前不要加 --profile admin）。
#   - 設定讀 .env.admin：複製 .env.example 後改 BOT_PROFILE=admin、填「管理端」LINE channel 的
#     LINE_CHANNEL_SECRET / LINE_CHANNEL_ACCESS_TOKEN，以及 ADMIN_USER_IDS、ESHOP_BOT_USERNAME /
#     ESHOP_BOT_PASSWORD、ANTHROPIC_API_KEY（admin profile 缺這些會啟動失敗）。
#   - 資料獨立：SQLite 落在 ./data-admin（bind mount 到容器 /data），備份方式同上；首次啟動前 `mkdir -p data-admin`。
#   - 容器內仍聽 8090（PORT 預設值），只有 host 端對應改成 8091：port 8091 只給家用網路檢查用
#     （curl http://<Pi 的 IP>:8091/health），對外一律走 tunnel。
#   - Cloudflare Zero Trust 多加一個 Public Hostname：linebot-admin.yuzen.tw → http://linebot-admin:8090
#     （tunnel 網路別名 linebot-admin），WAF 同樣放行 /webhook 與 /grok/callback；
#     管理端 LINE channel 的 webhook URL 填 https://linebot-admin.yuzen.tw/webhook。
#   - 改 .env.admin 後：docker compose -f docker-compose.pi.yml up -d --force-recreate linebot-admin
services:
  linebot:
    container_name: linebot
    build: .
    ports:
      - '8090:8090'
    env_file: .env
    environment:
      # 容器內固定用 /data（對應 Pi 上的 ./data）；TZ 由 .env 提供
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      default:
      tunnel:
        aliases: [linebot]

  linebot-admin:
    container_name: linebot-admin
    build: .
    profiles: ['admin']
    ports:
      - '8091:8090'
    env_file: .env.admin
    environment:
      # 容器內固定用 /data（對應 Pi 上的 ./data-admin）；port 仍是 8090，只有 host 端映射到 8091
      BOT_PROFILE: admin
      DATA_DIR: /data
    volumes:
      - ./data-admin:/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      default:
      tunnel:
        aliases: [linebot-admin]

networks:
  tunnel:
    name: bfx-multi_default
    external: true
